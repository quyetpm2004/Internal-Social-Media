services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --lower-case-table-names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: collabnet
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "8080"
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      DATABASE_NAME: collabnet
      DATABASE_URL: mysql://app:app@db:3306/collabnet
      REDIS_URL: redis://redis:6379
      URL_FRONTEND: http://localhost:5173
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_URL_BACKEND: http://localhost:8080
        VITE_BASE_URL_FRONTEND: http://localhost:5173
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
